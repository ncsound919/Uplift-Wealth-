# Render.com blueprint — deploys Overlay Wealth as a Docker web service.
services:
  - type: web
    name: overlay-wealth
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set secrets in the Render dashboard, never in this file:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: VITE_POSTHOG_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@overlaywealth.org
      # Public URL + CORS origin allow-list:
      - key: APP_URL
        value: https://overlay-wealth.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://overlay-wealth.onrender.com
