name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Pre-deploy Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://overlay-wealth.onrender.com
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Render deploy triggered"

  smoke-test:
    name: Post-deploy Smoke Test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for /api/health (max 5 min)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "https://overlay-wealth.onrender.com/api/health"; then
              echo "health OK"
              exit 0
            fi
            sleep 10
          done
          echo "health endpoint never became ready" >&2
          exit 1

      - name: Verify site endpoints
        run: |
          curl -fsS -o /dev/null -w "root: %{http_code}\n" https://overlay-wealth.onrender.com/
          curl -fsS -o /dev/null -w "sitemap: %{http_code}\n" https://overlay-wealth.onrender.com/sitemap.xml
